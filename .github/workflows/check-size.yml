name: check-size

on: pull_request

jobs:
  build:
    name: ruby ${{ matrix.ruby }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        arch: ["amd64", "arm64"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build Layers
        env:
          RUBY_VERSION: ${{ matrix.ruby }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/build_layers.sh

      - name: Check Size
        env:
          RUBY_VERSION: ${{ matrix.ruby }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/check_layer_size.sh

  # Keeps the required status check name stable. Matrix jobs are reported
  # individually, so branch protection that requires "check-size" still matches.
  check-size:
    needs: build
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require all layer builds
        run: test "${{ needs.build.result }}" = "success"
